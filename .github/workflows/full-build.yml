name: Full Build
# 构建完整版 TrafficMonitor（含硬件监控），产物提交到 ci-artifacts 分支供下载
# 注意：runner 镜像同时装有 VS2022（带 v143 MFC）和 VS 18（无 MFC），vswhere -latest 会选 VS 18，
# 必须显式限定 VS 2022（版本 [17.0,18.0)）
on:
  push:
    branches:
      - 'feature/taskbar-tip-toggle'
    paths:
      - '.github/workflows/full-build.yml'
      - 'TrafficMonitor/**'
      - 'OpenHardwareMonitorApi/**'
permissions:
  contents: write
jobs:
  x64_full_build:
    runs-on: windows-2022
    steps:
    - name: Setup VS 2022 MSBuild (with v143 MFC)
      shell: pwsh
      run: |
        $vsPath = & "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe" -latest -version "[17.0,18.0)" -property installationPath
        Write-Host "Using VS 2022 at: $vsPath"
        if (-not $vsPath) { Write-Error "VS 2022 instance not found"; exit 1 }
        $atlmfc = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\atlmfc" -Directory -ErrorAction SilentlyContinue
        Write-Host "atlmfc present: $($atlmfc.FullName)"
        if (-not $atlmfc) { Write-Error "MFC libraries missing in VS 2022 instance"; exit 1 }
        Add-Content $env:GITHUB_PATH "$vsPath\MSBuild\Current\Bin"

    - uses: actions/checkout@v3

    - name: Build full solution (Release x64)
      shell: pwsh
      run: |
        $msbuild = (Get-Command msbuild.exe).Source
        Write-Host "msbuild: $msbuild"
        & $msbuild TrafficMonitor.sln -p:configuration="Release" -p:platform=x64 -p:PlatformToolset=v143 -m -fl -flp:logfile=build.log
        if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

    - name: Push build log on failure
      if: failure()
      shell: bash
      run: |
        git config user.name "ci-bot"
        git config user.email "ci-bot@users.noreply.github.com"
        if git ls-remote --exit-code origin refs/heads/ci-artifacts >/dev/null 2>&1; then
          git fetch origin ci-artifacts
          git checkout -B ci-artifacts FETCH_HEAD
        else
          git checkout --orphan ci-artifacts
        fi
        git rm -r -q --cached . >/dev/null 2>&1 || true
        git clean -fdx -q -e logs -e build.log || true
        mkdir -p logs
        cp build.log logs/build.log
        echo "build failed: $GITHUB_SHA  $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > logs/build-info.txt
        git add -A
        git commit -m "build log for $GITHUB_SHA" || echo "no log changes"
        git push -f origin ci-artifacts

    - name: Upload artifact
      if: success()
      uses: actions/upload-artifact@v4
      with:
        name: TrafficMonitor_full_x64_${{ github.sha }}
        path: |
          Bin/x64/Release/TrafficMonitor.exe
          Bin/x64/Release/*.dll
        retention-days: 14

    - name: Push artifacts to ci-artifacts branch
      if: success()
      shell: bash
      run: |
        git config user.name "ci-bot"
        git config user.email "ci-bot@users.noreply.github.com"
        mkdir -p latest
        cp Bin/x64/Release/TrafficMonitor.exe latest/
        cp Bin/x64/Release/*.dll latest/ 2>/dev/null || true
        echo "build: $GITHUB_SHA  $(date -u +'%Y-%m-%d %H:%M:%S UTC')" > latest/build-info.txt
        if git ls-remote --exit-code origin refs/heads/ci-artifacts >/dev/null 2>&1; then
          git fetch origin ci-artifacts
          git checkout -B ci-artifacts FETCH_HEAD
        else
          git checkout --orphan ci-artifacts
        fi
        git rm -r -q --cached . >/dev/null 2>&1 || true
        git clean -fdx -q -e latest || true
        git add -A
        git commit -m "CI artifacts for $GITHUB_SHA" || echo "no changes to artifacts"
        git push -f origin ci-artifacts
